[package]
name = "dinput8"
version = "0.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "z"
codegen-units = 1
debug = false

[dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.228", features = ["derive"] }
serde_repr = "0.1.20"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_SystemServices", "Win32_Security", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }
